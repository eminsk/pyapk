name: CI - pureapk

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} • ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version:
          # CPython Standard
          - '3.8'
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
          - '3.16'
          # Free-Threaded / No-GIL
          - '3.13t'
          - '3.14t'
          - '3.15t'
          - '3.16t'
          # PyPy JIT
          - 'pypy3.8'
          - 'pypy3.9'
          - 'pypy3.10'
          - 'pypy3.11'
          - 'pypy3.12'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv (fallback engine)
        id: setup-uv
        uses: astral-sh/setup-uv@v5
        continue-on-error: true

      - name: Run test suite on Python ${{ matrix.python-version }}
        shell: bash
        run: |
          if [ "${{ steps.setup-python.outcome }}" == "success" ]; then
            echo "Running via setup-python environment"
            python -m pip install --upgrade pip pytest pytest-cov hatchling || true
            python -m pip install -e . || pip install -e .
            python -m pytest -v --cov=pureapk
          else
            echo "Running via uv standalone environment"
            if ! command -v uv &> /dev/null; then
              pip install uv || python -m pip install uv || true
            fi
            uv run --python ${{ matrix.python-version }} --with pytest --with pytest-cov pytest -v --cov=pureapk
          fi

  build:
    name: Build Wheels & Source Distributions (pureapk + pyapk)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip hatchling build uv || true

      - name: Build all wheels and sdists
        run: |
          if command -v uv &> /dev/null; then
            uv run python scripts/build_all_wheels.py
          else
            python scripts/build_all_wheels.py
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
