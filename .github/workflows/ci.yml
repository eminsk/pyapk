name: CI - pureapk

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} • ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version:
          # CPython Standard
          - '3.8'
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
          - '3.16'
          # Free-Threaded / No-GIL
          - '3.13t'
          - '3.14t'
          - '3.15t'
          - '3.16t'
          # PyPy JIT
          - 'pypy3.8'
          - 'pypy3.9'
          - 'pypy3.10'
          - 'pypy3.11'
          - 'pypy3.12'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Run test suite on Python ${{ matrix.python-version }}
        shell: bash
        run: |
          if [ "${{ steps.setup-python.outcome }}" == "success" ]; then
            echo "Running via setup-python environment"
            python -m pip install --upgrade pip pytest pytest-cov hatchling || true
            python -m pip install -e . || pip install -e .
            python -m pytest -v --cov=pureapk
          else
            echo "Running via fallback Python / uv standalone environment"
            if ! command -v uv &> /dev/null; then
              curl -LsSf https://astral.sh/uv/install.sh | sh || true
              export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
            fi
            if command -v uv &> /dev/null; then
              uv run --python ${{ matrix.python-version }} --with pytest --with pytest-cov pytest -v --cov=pureapk
            else
              python -m pytest -v --cov=pureapk
            fi
          fi

  build:
    name: Build Wheels & Source Distributions (pureapk + pyapk)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip hatchling build uv || true

      - name: Build all wheels and sdists
        run: |
          python scripts/build_all_wheels.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  android-sdk-verify:
    name: Independent Android SDK Verification (apksigner + aapt2 + zipalign + dexdump)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pureapk and independent parsers
        run: |
          python -m pip install --upgrade pip pytest pyaxmlparser cryptography
          python -m pip install -e .

      - name: Verify generated APK with Android SDK build-tools & OpenSSL
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          echo "Using Android SDK build-tools: $BUILD_TOOLS_DIR"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          AAPT2="$BUILD_TOOLS_DIR/aapt2"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          DEXDUMP="$BUILD_TOOLS_DIR/dexdump"

          WORK_DIR=$(mktemp -d)
          pureapk init-kivy "$WORK_DIR/app" --title "SDK Verified Kivy App"

          pureapk generate-keystore -o "$WORK_DIR/release.keystore" --alias sdkkey --password sdkpass
          pureapk pack-kivy "$WORK_DIR/app" -o "$WORK_DIR/app.apk" \
            --package org.pureapk.sdkverified \
            --title "SDK Verified Kivy App" \
            --release \
            --keystore "$WORK_DIR/release.keystore" \
            --password sdkpass \
            --alias sdkkey

          echo "=== 0. Verify full Python/Kivy native runtime is bundled (no stubs) ==="
          pureapk verify "$WORK_DIR/app.apk" | tee "$WORK_DIR/verify.txt"
          grep "Runnable App:     True (Full Native Python Runtime)" "$WORK_DIR/verify.txt"
          python -c "
          import zipfile
          with zipfile.ZipFile('$WORK_DIR/app.apk') as zf:
              names = set(zf.namelist())
              assert 'lib/arm64-v8a/libpython3.10.so' in names
              assert 'lib/arm64-v8a/libpybundle.so' in names
              assert 'lib/armeabi-v7a/libpython3.10.so' in names
              assert zf.getinfo('lib/arm64-v8a/libpython3.10.so').file_size > 3000000
              assert zf.getinfo('lib/arm64-v8a/libpybundle.so').file_size > 9000000
              for i in ('', '2', '3', '4', '5', '6'):
                  assert f'classes{i}.dex' in names
          print('Full p4a Python 3.10 + Kivy runtime verified in APK!')
          "

          echo "=== 1. zipalign -c -v 4 ==="
          "$ZIPALIGN" -c -v 4 "$WORK_DIR/app.apk"

          echo "=== 2. apksigner verify --verbose --print-certs ==="
          CERT_OUT=$("$APKSIGNER" verify --verbose --print-certs "$WORK_DIR/app.apk")
          echo "$CERT_OUT"
          EXPECTED_FP=$(python -c "from pureapk.stores import ReleaseHelper; print(ReleaseHelper.load_release_keystore('$WORK_DIR/release.keystore', 'sdkpass', 'sdkkey')['sha256_fingerprint'])")
          echo "Expected keystore SHA-256: $EXPECTED_FP"
          echo "$CERT_OUT" | grep -i "$EXPECTED_FP"

          echo "=== 3. aapt2 dump badging & resources ==="
          "$AAPT2" dump badging "$WORK_DIR/app.apk"
          "$AAPT2" dump resources "$WORK_DIR/app.apk"

          echo "=== 4. dexdump -f ==="
          unzip -q "$WORK_DIR/app.apk" classes.dex META-INF/CERT.RSA META-INF/CERT.SF -d "$WORK_DIR/extracted"
          "$DEXDUMP" -f "$WORK_DIR/extracted/classes.dex" | head -n 30

          echo "=== 5. openssl cms -verify ==="
          openssl cms -verify -inform DER \
            -in "$WORK_DIR/extracted/META-INF/CERT.RSA" \
            -content "$WORK_DIR/extracted/META-INF/CERT.SF" \
            -noverify -out /dev/null

