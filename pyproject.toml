[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pureapk"
version = "1.0.1"
description = "High-performance pure Python APK inspection, multi-store packager, and framework toolchain with zero dependencies."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "eminsk", email = "M_N_N@tut.by" }
]
requires-python = ">=3.8"
dependencies = []
keywords = [
    "apk",
    "android",
    "pure-python",
    "zipalign",
    "16kb-alignment",
    "android15",
    "aab",
    "ipa",
    "msix",
    "wheels",
    "cython",
    "kivy",
    "pygame",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3.16",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov",
]
kivy = ["kivy>=2.2.0"]
pygame = ["pygame-ce>=2.4.0"]
flet = ["flet>=0.21.0"]
toga = ["toga>=0.4.0"]
all = [
    "kivy>=2.2.0",
    "pygame-ce>=2.4.0",
    "flet>=0.21.0",
    "toga>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/eminsk/pureapk"
Repository = "https://github.com/eminsk/pureapk.git"
Issues = "https://github.com/eminsk/pureapk/issues"

[project.scripts]
pureapk = "pureapk.cli:main"
pyapk = "pureapk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pureapk", "src/pyapk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
]
